<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🎬 Watch Party</span>

    <span class="text-white">
        Room ID:
        <strong id="room-id">{{ room }}</strong>
    </span>
</nav>

<div class="container-fluid mt-3">

    <div class="row">

        <!-- Video Section -->
        <div class="col-lg-8">

            <!-- Video Player -->
            <div class="card">

                <div class="card-body">

                    <iframe
                        id="video-player"
                        width="100%"
                        height="500"
                        src=""
                        allowfullscreen>
                    </iframe>

                </div>

            </div>

            <!-- Video Link -->
            <div class="mt-3">

                <input
                    type="text"
                    id="video-link"
                    class="form-control"
                    placeholder="Paste YouTube or Video URL">

                <button
                    id="change-video"
                    class="btn btn-primary mt-2">
                    Change Video
                </button>

            </div>

        </div>

        <!-- Chat -->
        <div class="col-lg-4">

            <div class="card">

                <div class="card-header">
                    Chat
                </div>

                <div
                    id="chat-box"
                    style="height:500px;overflow-y:auto;">

                </div>

                <div class="card-footer">

                    <input
                        type="text"
                        id="message"
                        class="form-control"
                        placeholder="Type message">

                    <button
                        id="send"
                        class="btn btn-success mt-2 w-100">
                        Send
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>

<!-- Your JS AFTER -->
<script>
const socket = io();

socket.on("connect", () => {
    console.log("CONNECTED", socket.id);
});

socket.on("disconnect", () => {
    console.log("DISCONNECTED");
});

socket.on("connect_error", (err) => {
    console.log("CONNECT ERROR:", err);
});



function detectSource(url) {
  if (url.includes("youtube.com") || url.includes("youtu.be")) return "youtube";
  if (url.endsWith(".mp4") || url.endsWith(".webm")) return "html5";
  return "unknown";
}


const roomId = "{{ room }}";
const username = "{{ username }}";

console.log("ROOM:", roomId);
console.log("USER:", username);


socket.on("connect", () => {

    console.log("CONNECTED:", socket.id);

    socket.emit("join", {
        room: roomId,
        username: username
    });

});


socket.on("message", function(data){

    console.log("MESSAGE:", data);

    document.getElementById("chat-box").innerHTML += `
        <p>
        <b>${data.username}</b>: ${data.message}
        </p>
    `;

});

socket.on("video_changed", function(data) {
  const type = detectSource(data.url);

  if (type === "youtube") {
    // Use iframe embed
    document.getElementById("video-player").outerHTML = `
      <iframe id="video-player" width="100%" height="500"
        src="${getEmbedUrl(data.url)}"
        allowfullscreen></iframe>
    `;
    // YouTube IFrame API will sync play/pause
  } else if (type === "html5") {
    // Replace iframe with <video>
    document.getElementById("video-player").outerHTML = `
      <video id="video-player" width="100%" height="500" controls>
        <source src="${data.url}" type="video/mp4">
      </video>
    `;
    const video = document.getElementById("video-player");
    attachHtml5Listeners(video);
  } else {
    console.log("Unsupported video type:", data.url);
  }
});


function attachHtml5Listeners(video) {
  video.addEventListener("play", () => {
    socket.emit("video:play", { room: roomId, currentTime: video.currentTime });
  });

  video.addEventListener("pause", () => {
    socket.emit("video:pause", { room: roomId, currentTime: video.currentTime });
  });

  video.addEventListener("seeked", () => {
    socket.emit("video:seek", { room: roomId, currentTime: video.currentTime });
  });

  socket.on("video:play", (data) => {
    video.currentTime = data.currentTime;
    video.play();
  });

  socket.on("video:pause", (data) => {
    video.currentTime = data.currentTime;
    video.pause();
  });

  socket.on("video:seek", (data) => {
    video.currentTime = data.currentTime;
  });
}






function getEmbedUrl(url) {

    if (url.includes("watch?v=")) {
        return url.replace("watch?v=", "embed/");
    }

    if (url.includes("youtu.be/")) {
        let id = url.split("youtu.be/")[1];
        return "https://www.youtube.com/embed/" + id;
    }

    return url;
}


document.getElementById("change-video").onclick = function () {

    let url = document.getElementById("video-link").value;

    socket.emit("change_video", {
        room: roomId,
        url: getEmbedUrl(url)
    });

};


document.getElementById("send").onclick = function(){

    let msg = document.getElementById("message").value;

    socket.emit("send_message", {
        room: roomId,
        username: username,
        message: msg
    });

};

</script>
    

</body>
</html>
